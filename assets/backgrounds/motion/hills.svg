<circle class="mote" cx="463" cy="624" r="2.7" fill="#f2e8c9" style="animation-delay:-13.2s"/>
<circle class="mote" cx="706" cy="285" r="2.0" fill="#f2e8c9" style="animation-delay:-7.2s"/>
<circle class="mote" cx="1134" cy="206" r="2.6" fill="#f2e8c9" style="animation-delay:-11.7s"/>
