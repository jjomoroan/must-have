<circle class="mote" cx="783" cy="293" r="2.2" fill="#f2e8c9" style="animation-delay:-8.7s"/>
<circle class="mote" cx="208" cy="172" r="1.7" fill="#f2e8c9" style="animation-delay:-1.0s"/>
<circle class="mote" cx="1362" cy="230" r="2.3" fill="#f2e8c9" style="animation-delay:-13.6s"/>
<circle class="mote" cx="1170" cy="276" r="1.1" fill="#f2e8c9" style="animation-delay:-8.1s"/>
<rect x="-80" y="860" width="1760" height="200" fill="#c6d49a" opacity=".04" filter="url(#wash)"/>
</svg>
