<path class="bird" style="animation-delay:-4s" d="M990 284 q 8 -7 16 0 q 8 -7 16 0" fill="none" stroke="#5d6f5a" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
<path class="bird" style="animation-delay:-8s" d="M1080 250 q 8 -7 16 0 q 8 -7 16 0" fill="none" stroke="#5d6f5a" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
