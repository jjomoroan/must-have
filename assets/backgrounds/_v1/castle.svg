  <style>
    .draw {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: sketch 26s cubic-bezier(.35, .1, .25, 1) infinite;
    }
    .g2 { animation-delay: 1.1s; }
    .g3 { animation-delay: 2.2s; }
    .g4 { animation-delay: 3.3s; }
    .g5 { animation-delay: 4.4s; }
    .g6 { animation-delay: 5.5s; }
    .g7 { animation-delay: 6.6s; }
    .g8 { animation-delay: 7.7s; }
    .g9 { animation-delay: 8.8s; }
    .g10 { animation-delay: 9.5s; }
    .pavilion { animation: pavilion-fade 26s ease-in-out infinite; }
    .pines { animation: pines-sway 18s ease-in-out infinite; transform-origin: 700px 900px; }
    .right-pine { animation: pines-sway 23s ease-in-out infinite reverse; transform-origin: 1372px 900px; }
    .seal { animation: seal-in 26s ease-in-out infinite; }
    .dust circle { animation: dust-float 12s ease-in-out infinite; }
    .dust circle:nth-child(2n) { animation-delay: -4s; animation-duration: 16s; }
    .dust circle:nth-child(3n) { animation-delay: -8s; animation-duration: 20s; }

    @keyframes sketch {
      0% { stroke-dashoffset: 1; opacity: 0; }
      4% { stroke-dashoffset: 1; opacity: .9; }
      70% { stroke-dashoffset: 0; opacity: .9; }
      92% { stroke-dashoffset: 0; opacity: .7; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes pavilion-fade {
      0%, 4% { opacity: .55; }
      12%, 94% { opacity: 1; }
      100% { opacity: .55; }
    }
    @keyframes pines-sway {
      0%, 100% { transform: rotate(-.35deg); }
      50% { transform: rotate(.4deg); }
    }
    @keyframes seal-in {
      0%, 22% { opacity: 0; transform: translate(1378px, 242px) scale(.9); }
      28%, 94% { opacity: .9; transform: translate(1378px, 242px) scale(1); }
      100% { opacity: 0; }
    }
    @keyframes dust-float {
      0%, 100% { transform: translate(0, 0); opacity: .15; }
      50% { transform: translate(8px, -12px); opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw { stroke-dashoffset: 0; animation: none !important; }
      .pavilion, .pines, .right-pine, .seal, .dust circle { animation: none !important; }
      .pavilion { opacity: 1; }
    }
  </style>
</svg>
