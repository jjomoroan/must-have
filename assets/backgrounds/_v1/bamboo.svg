  <style>
    .birds { animation: birds-drift 18s ease-in-out infinite; }
    .frond { will-change: transform; }
    .fl-1 { transform-origin: 168px 640px; animation: sway-a 13s ease-in-out infinite; }
    .fl-2 { transform-origin: 162px 746px; animation: sway-b 16s ease-in-out infinite; }
    .fl-3 { transform-origin: 170px 500px; animation: sway-a 15s ease-in-out infinite reverse; }
    .fr-1 { transform-origin: 1354px 510px; animation: sway-b 14s ease-in-out infinite; }
    .fr-2 { transform-origin: 1354px 660px; animation: sway-a 17s ease-in-out infinite reverse; }
    .fr-3 { transform-origin: 1346px 355px; animation: sway-b 15s ease-in-out infinite reverse; }
    .fr-4 { transform-origin: 1446px 536px; animation: sway-a 18s ease-in-out infinite; }
    .fr-5 { transform-origin: 1444px 845px; animation: sway-b 16s ease-in-out infinite reverse; }
    .bamboo-right { animation: stalk-sway 20s ease-in-out infinite; transform-origin: 1400px 1000px; }
    .leaf { animation: leaf-drift 22s linear infinite; }
    .lf1 { animation-delay: -2s; animation-duration: 25s; }
    .lf2 { animation-delay: -11s; animation-duration: 29s; }
    .lf3 { animation-delay: -6s; animation-duration: 23s; }
    .lf4 { animation-delay: -17s; animation-duration: 31s; }
    .lf5 { animation-delay: -8s; animation-duration: 27s; }

    @keyframes sway-a {
      0%, 100% { transform: rotate(-1.15deg) translateX(-2px); }
      50% { transform: rotate(1.3deg) translateX(3px); }
    }
    @keyframes sway-b {
      0%, 100% { transform: rotate(1.1deg) translateX(2px); }
      50% { transform: rotate(-1.25deg) translateX(-3px); }
    }
    @keyframes stalk-sway {
      0%, 100% { transform: rotate(-.22deg); }
      50% { transform: rotate(.28deg); }
    }
    @keyframes leaf-drift {
      0% { transform: translate(0, -40px) rotate(0deg); opacity: 0; }
      10% { opacity: .75; }
      60% { transform: translate(46px, 190px) rotate(210deg); opacity: .6; }
      100% { transform: translate(-18px, 390px) rotate(420deg); opacity: 0; }
    }
    @keyframes birds-drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, -7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .birds, .frond, .bamboo-right, .leaf { animation: none !important; }
    }
  </style>
</svg>
