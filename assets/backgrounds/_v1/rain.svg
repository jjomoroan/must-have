  <style>
    .rd { animation-name: rainfall; animation-timing-function: linear; animation-iteration-count: infinite; stroke-width: 2; }
    .ripple { transform-box: view-box; animation: ripple 7.5s ease-out infinite; }
    .rp-2 { animation-delay: -2.8s; animation-duration: 8.5s; }
    .rp-3 { animation-delay: -5.1s; animation-duration: 9.4s; }
    .rp-4 { animation-delay: -3.6s; animation-duration: 10s; }
    .drop-ring { animation: splash 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .dr-2 { animation-delay: -1.2s; }
    .lotus { animation: lotus-bob 12s ease-in-out infinite; transform-origin: 1400px 760px; }
    .birds { animation: birds-drift 20s ease-in-out infinite; }

    @keyframes rainfall {
      0% { transform: translate(0, 0); opacity: 0; }
      8% { opacity: .9; }
      78% { opacity: .55; }
      100% { transform: translate(-16px, 275px); opacity: 0; }
    }
    @keyframes ripple {
      0% { transform: scale(.35); opacity: 0; }
      12% { opacity: .85; }
      70% { opacity: .34; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    @keyframes splash {
      0%, 100% { transform: scale(.6); opacity: .2; }
      35% { transform: scale(1.35); opacity: .85; }
    }
    @keyframes lotus-bob {
      0%, 100% { transform: translateY(0) rotate(-.5deg); }
      50% { transform: translateY(4px) rotate(.7deg); }
    }
    @keyframes birds-drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(14px, -5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rd, .ripple, .drop-ring, .lotus, .birds { animation: none !important; }
    }
  </style>
